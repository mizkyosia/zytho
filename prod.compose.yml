services:
  migrate:
    build:
      context: .
      dockerfile: prod.Dockerfile
      target: migrator
    env_file: .env
    container_name: zytho-migrate
    restart: "no"
    networks:
      - zytho
    depends_on:
      db:
        condition: service_healthy

  zytho:
    build:
      context: .
      dockerfile: prod.Dockerfile
    env_file: .env
    container_name: zytho
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik-public
      - zytho
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zytho.rule=Host(`zytho.mizkyosia.fr`)"
      - "traefik.http.routers.zytho.entrypoints=web"
      - "traefik.http.services.zytho.loadbalancer.server.port=${PORT}"

networks:
  zytho:
    external: true
  traefik-public:
    external: true
